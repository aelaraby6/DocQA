name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Pip Packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Lint Checks
      run: |
        # Stop the build if there are syntax errors or undefined names
        flake8 src ui --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats other errors as warnings.
        flake8 src ui --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Sanity Integration Test
      run: |
        python -m tests.test_sanity
